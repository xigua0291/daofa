name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build unsigned .app
      run: |
        xcodebuild -project DaoFa.xcodeproj \
          -scheme DaoFa \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/DaoFa.xcarchive \
          archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
    - name: Pack unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/DaoFa.xcarchive/Products/Applications/DaoFa.app Payload/
        zip -r DaoFa-unsigned.ipa Payload
        ls -lh DaoFa-unsigned.ipa
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DaoFa-unsigned-ipa
        path: DaoFa-unsigned.ipa
