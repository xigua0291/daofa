name: Extract project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit project files
        run: |
          unzip -o daofa-ios-github-build.zip
          echo "===== build-ipa.yml ====="
          cat daofa-ios-github-build/.github/workflows/build-ipa.yml
          echo "===== end build-ipa.yml ====="
          cp -R daofa-ios-github-build/DaoFa .
          cp daofa-ios-github-build/project.yml daofa-ios-github-build/dao-fa-suan-ming.html daofa-ios-github-build/README-GITHUB.md .
          rm -rf daofa-ios-github-build daofa-ios-github-build.zip README.md
          git config user.name "xigua0291"
          git config user.email "1018316746@qq.com"
          git add -A
          git status
          git commit -m "Upload project files from daofa-ios-github-build.zip"
          git push
